name: Java PR Code Review Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install ReviewDog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b ./bin

      - name: Install xsltproc
        run: |
          sudo apt-get update
          sudo apt-get install -y xsltproc

      # Run PMD
      - name: Run PMD
        run: mvn pmd:pmd

      - name: Convert PMD XML to text format
        run: |
          xsltproc https://raw.githubusercontent.com/reviewdog/errorformat/master/xsl/pmd.xsl target/pmd.xml > pmd.out || true

      - name: ReviewDog - PMD
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/reviewdog -efm="%f:%l: %m" \
            -name="PMD" \
            -reporter=github-pr-review \
            -level=warning < pmd.out

      # Run SpotBugs
      - name: Run SpotBugs
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:spotbugs

      - name: Convert SpotBugs XML to text format
        run: |
          if [ ! -s target/spotbugsXml.xml ]; then
            echo "target/spotbugsXml.xml is missing or empty!"; ls -l target; exit 1;
          fi
          xsltproc pmd/xsl/spotbugs.xsl target/spotbugsXml.xml > spotbugs.out
          if [ ! -s spotbugs.out ]; then
            echo "spotbugs.out is missing or empty!"; cat target/spotbugsXml.xml; exit 1;
          fi
          echo "spotbugs.out contents:"; cat spotbugs.out

      - name: ReviewDog - SpotBugs
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/reviewdog -efm="%f:%l: %m" \
            -name="SpotBugs" \
            -reporter=github-pr-review \
            -level=warning < spotbugs.out
