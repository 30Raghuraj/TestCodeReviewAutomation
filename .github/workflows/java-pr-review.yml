name: Java PR Code Review Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code_review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Run Maven verify (build + SpotBugs + PMD)
        run: mvn verify

      - name: Install ReviewDog
        run: curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b ./bin

      - name: ReviewDog SpotBugs results
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/reviewdog -f=spotbugs \
            -name="SpotBugs" \
            -reporter=github-pr-review \
            -level=warning \
            < target/spotbugsXml.xml

      - name: ReviewDog PMD results
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/reviewdog -f=pmd \
            -name="PMD" \
            -reporter=github-pr-review \
            -level=warning \
            < target/pmd.xml
