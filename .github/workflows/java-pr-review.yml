name: Java PR Code Review Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install ReviewDog
        run: curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b ./bin

      # --------------------------
      # Run PMD + ReviewDog
      # --------------------------
      - name: Run PMD
        run: mvn pmd:pmd

      - name: ReviewDog - PMD
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/reviewdog -f=pmd \
            -name="PMD" \
            -reporter=github-pr-review \
            -level=warning \
            < target/pmd.xml

      # --------------------------
      # Run SpotBugs + ReviewDog (via custom errorformat)
      # --------------------------
      - name: Run SpotBugs
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:spotbugs

      - name: Convert SpotBugs XML to readable format
        run: |
          apt-get update && apt-get install -y xsltproc
          xsltproc https://raw.githubusercontent.com/reviewdog/errorformat/master/xsl/spotbugs.xsl \
            target/spotbugsXml.xml > spotbugs.out || true

      - name: ReviewDog - SpotBugs
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/reviewdog -efm="%f:%l: %m" \
            -name="SpotBugs" \
            -reporter=github-pr-review \
            -level=warning < spotbugs.out
