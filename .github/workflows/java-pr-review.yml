name: Java PR Code Review Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install ReviewDog
        run: curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b ./bin

      # Run PMD
      - name: Run PMD
        run: mvn pmd:pmd

      # ReviewDog for PMD results
      - name: ReviewDog PMD Analysis
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/reviewdog -f=pmd \
            -name="PMD" \
            -reporter=github-pr-review \
            -level=warning \
            < target/pmd.xml

      # Run SpotBugs with ReviewDog using official action
      - name: Run SpotBugs with ReviewDog
        uses: reviewdog/action-spotbugs@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning
          reporter: github-pr-review
          spotbugs_version: '4.7.3'
